<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ゼルダの伝説クイズ</title>
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --bg: #0d1117; --card: #1d2433; --border: #2c3548;
    --accent: #f59e0b; --accent2: #38bdf8; --text: #e6e9f0; --muted: #7d8aa3;
    --danger: #f87171; --success: #4ade80; --radius: 16px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.6; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; margin-bottom: 8px; }
  .q { font-size: 1.05rem; font-weight: 600; margin: 0 0 14px; }
  .choices { display: grid; gap: 10px; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .choice { text-align: left; background: transparent; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; min-height: 48px; }
  .choice:hover:not(:disabled) { border-color: var(--accent2); }
  .choice.ok { border-color: var(--success); background: rgba(74,222,128,.12); }
  .choice.ng { border-color: var(--danger); background: rgba(248,113,113,.12); }
  .choice:disabled { cursor: default; }
  .exp { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: rgba(56,189,248,.08);
    border-left: 3px solid var(--accent2); font-size: .92rem; }
  .exp b { display: block; margin-bottom: 4px; }
  .primary { width: 100%; margin-top: 16px; background: var(--accent); color: #111; border: 0;
    border-radius: 12px; padding: 13px; font-weight: 700; min-height: 48px; }
  .score { font-size: 3rem; font-weight: 800; color: var(--accent); text-align: center; margin: 8px 0 0; }
  .rank { text-align: center; font-size: 1.1rem; margin: 4px 0 12px; }
  .review { list-style: none; padding: 0; margin: 12px 0 0; font-size: .88rem; }
  .review li { padding: 8px 0; border-top: 1px solid var(--border); }
  .note { color: var(--muted); font-size: .75rem; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>🗡️ ゼルダの伝説クイズ</h1>
  <p class="sub">全<span id="total"></span>問・4択。シリーズ作品の基本知識から出題します。</p>
  <div class="card" id="app"></div>
  <p class="note">非公式のファンクイズです。『ゼルダの伝説』は任天堂の商標です。発売日は日本国内のものです。</p>
</main>
<script>
// a = 正解の選択肢（choices[0] が正解。表示時にシャッフル）
const QUESTIONS = [
  { q: 'シリーズ第1作『ゼルダの伝説』が日本で発売されたのは何年？',
    c: ['1986年', '1983年', '1989年', '1991年'],
    e: '1986年2月21日、ファミリーコンピュータ ディスクシステム用ソフトとして発売されました。' },
  { q: 'シリーズの主人公（プレイヤーが操作する緑の服の青年）の名前は？',
    c: ['リンク', 'ゼルダ', 'ガノン', 'インパ'],
    e: 'タイトルの「ゼルダ」は姫の名前。主人公はリンクです。混同されやすい定番ポイント。' },
  { q: 'シリーズの生みの親として知られ、『スーパーマリオ』も手がけた人物は？',
    c: ['宮本茂', '桜井政博', '岩田聡', '横井軍平'],
    e: '宮本茂氏が手塚卓志氏らとともに第1作を生み出しました。' },
  { q: 'トライフォースを構成する3つの力。「力」「知恵」と、もう1つは？',
    c: ['勇気', '希望', '光', '時'],
    e: '力・知恵・勇気の3つ。一般にガノンが力、ゼルダが知恵、リンクが勇気を宿すとされます。' },
  { q: 'シリーズを通して登場する、魔王ガノンの人間の姿での名前は？',
    c: ['ガノンドロフ', 'ザント', 'ギラヒム', 'バルバ'],
    e: 'ガノンドロフはゲルド族の男性。『時のオカリナ』で初めて人間の姿が描かれました。' },
  { q: '退魔の剣とも呼ばれる、リンクの代名詞といえる剣の名前は？',
    c: ['マスターソード', 'エクスカリバー', 'ホワイトソード', 'ブレイブソード'],
    e: 'マスターソードは『神々のトライフォース』で初登場し、以後多くの作品に登場します。' },
  { q: 'シリーズに登場するお金（通貨）の名前は？',
    c: ['ルピー', 'ゴールド', 'ギル', 'ゼニー'],
    e: '宝石の形をしたルピー。色によって価値が違います。' },
  { q: '『ゼルダの伝説 時のオカリナ』（1998年）が発売されたゲーム機は？',
    c: ['NINTENDO64', 'スーパーファミコン', 'ゲームキューブ', 'Wii'],
    e: 'シリーズ初の3D作品。Z注目（ロックオン）など、後の3Dアクションに大きな影響を与えました。' },
  { q: '『時のオカリナ』でリンクの相棒となる妖精の名前は？',
    c: ['ナビィ', 'チャット', 'ミドナ', 'ファイ'],
    e: 'ナビィは海外版の「Hey! Listen!」の呼びかけでも有名。チャットは『ムジュラの仮面』、ミドナは『トワイライトプリンセス』、ファイは『スカイウォードソード』の相棒です。' },
  { q: '『ムジュラの仮面』で、月が落ちてくるまでの期限は何日間？',
    c: ['3日間', '7日間', '1日間', '30日間'],
    e: '3日間をオカリナで何度も繰り返しながら、世界を救う方法を探します。' },
  { q: '『夢をみる島』の舞台となる島の名前は？',
    c: ['コホリント島', 'ハイラル島', 'ラブラ島', 'ゾーラ島'],
    e: '嵐で難破したリンクが流れ着く島。ハイラルが舞台ではない異色作です。' },
  { q: '『風のタクト』で、リンクが大海原を旅するときに乗る、しゃべる船の名前は？',
    c: ['赤獅子の王', '黄金丸', '海王丸', '白鯨号'],
    e: '世界の大半が海に沈んだ物語。赤獅子の王に乗って島々を巡ります。' },
  { q: '『ブレス オブ ザ ワイルド』が発売されたのは何年？',
    c: ['2017年', '2015年', '2019年', '2020年'],
    e: '2017年3月3日、Nintendo Switch（本体と同日）とWii Uで発売されました。' },
  { q: '『ブレス オブ ザ ワイルド』で、各地に隠れている森の精霊は？',
    c: ['コログ', 'デクナッツ', 'キュイ', 'ゴロン'],
    e: 'コログを見つけると「コログのミ」がもらえます。その数は900個。' },
  { q: '2024年発売の『ゼルダの伝説 知恵のかりもの』が、シリーズで初めて試みたことは？',
    c: ['ゼルダ姫が主人公として操作できる', 'オンライン協力プレイ専用', '舞台が現代の日本', 'リンクがしゃべる'],
    e: 'シリーズの本編で初めてゼルダ姫が主人公。「カリモノ」を呼び出して謎を解きます。' },
];

const $ = (s) => document.querySelector(s);
const app = $('#app');
$('#total').textContent = QUESTIONS.length;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let order, idx, score, log;

function start() {
  order = shuffle(QUESTIONS);
  idx = 0; score = 0; log = [];
  render();
}

function render() {
  const item = order[idx];
  const answer = item.c[0];
  app.innerHTML = `
    <div class="bar"><div style="width:${(idx / order.length) * 100}%"></div></div>
    <div class="meta"><span>第${idx + 1}問 / ${order.length}</span><span>正解 ${score}</span></div>
    <p class="q"></p>
    <div class="choices"></div>`;
  app.querySelector('.q').textContent = item.q;
  const box = app.querySelector('.choices');
  shuffle(item.c).forEach((text) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.textContent = text;
    b.onclick = () => choose(b, text === answer, item, answer);
    box.appendChild(b);
  });
}

function choose(btn, correct, item, answer) {
  app.querySelectorAll('.choice').forEach((b) => {
    b.disabled = true;
    if (b.textContent === answer) b.classList.add('ok');
  });
  if (correct) score++; else btn.classList.add('ng');
  log.push({ q: item.q, answer, correct });
  const exp = document.createElement('div');
  exp.className = 'exp';
  exp.innerHTML = `<b>${correct ? '⭕ 正解！' : '❌ 残念… 正解は「' + answer.replace(/[<>&]/g, '') + '」'}</b>`;
  exp.append(item.e);
  app.appendChild(exp);
  const next = document.createElement('button');
  next.className = 'primary';
  next.textContent = idx + 1 < order.length ? '次の問題へ' : '結果を見る';
  next.onclick = () => { idx++; idx < order.length ? render() : result(); };
  app.appendChild(next);
  next.focus();
}

function result() {
  const n = order.length;
  const rate = score / n;
  const rank = rate === 1 ? '👑 ハイラルの勇者' : rate >= .8 ? '🗡️ マスターソードの使い手'
    : rate >= .5 ? '🛡️ 一人前の冒険者' : '🌱 旅立ったばかりの若者';
  app.innerHTML = `
    <div class="bar"><div style="width:100%"></div></div>
    <p class="score">${score} / ${n}</p>
    <p class="rank">${rank}</p>
    <ul class="review"></ul>
    <button class="primary">もう一度挑戦する</button>`;
  const ul = app.querySelector('.review');
  log.forEach((r) => {
    const li = document.createElement('li');
    li.textContent = `${r.correct ? '⭕' : '❌'} ${r.q} → ${r.answer}`;
    ul.appendChild(li);
  });
  app.querySelector('.primary').onclick = start;
}

start();
</script>
</body>
</html>
