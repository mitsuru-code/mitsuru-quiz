name: mamechishiki-news

# 豆知識帳（時事モード）用のニュース見出しを毎時集めて mamechishiki/news.json を更新する。
# claude.ai のクラウドルーティンはニュースサイトへ直接アクセスできないため、取得はここで行い、
# ルーティンはこのリポジトリのJSONを読んで選別・保存する。X投稿のcloud-botとは無関係。

on:
  schedule:
    # 毎時。GitHubの定時実行は2〜5時間遅れることがあり（2026-09実測）、1日3回だと
    # ルーティン（JST 6:15/12:15/18:15）の時点で最大7時間古い見出しを読んでいた。
    # 毎時にしておけば遅延があっても直近の取得結果が残る。見出しに変化がなければコミットしない。
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mamechishiki-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch headlines
        run: python mamechishiki/fetch_news.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain mamechishiki/news.json)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mamechishiki/news.json
          git commit -m "mamechishiki: ニュース見出しを更新 [skip ci]"
          git push
