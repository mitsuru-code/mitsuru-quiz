# クラウドBot監視用ワークフロー（デッドマン・スイッチ）
#
# cloud-bot.yml（本体）の「失敗をIssueで通知」は、ワークフローが実際に実行され、その中の
# 何かのステップが失敗した場合しか動かない。2026-08-06のGitHub Actions大規模障害
# （ホストランナーを確保できずジョブが1ステップも実行されずに終了する）のように、
# ワークフローそのものが起動できない場合は本体側の通知ステップも同様に動けないため、
# 3時間以上投稿が止まっても誰にも気づけなかった。
#
# このワークフローは本体とは別のcron・別のジョブとして独立して動く。Anthropic/X APIの
# Secretsは一切使わず、state.jsonの投稿状況だけを読んで判定する（cloud-bot/watchdog.mjs）。
# 本体が停止していても、GitHub Actions自体が復旧すればこちらは動けるため気づける。
name: Cloud Bot Watchdog

on:
  schedule:
    # 本体のトリガー(毎時2,17,32,47分)と重ならないよう5分ずらす。監視なので30分おきで十分
    - cron: '5,35 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生存確認
        id: check
        run: |
          if node cloud-bot/watchdog.mjs; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 無言停止をIssueで通知
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.check.outputs.stale }}
        run: |
          gh label create cloud-bot-silence --repo "${{ github.repository }}" --color B60205 --description "Cloud Botが長時間投稿していない（実行自体が動いていない疑い）" 2>/dev/null || true
          issue_number=$(gh issue list --repo "${{ github.repository }}" --label cloud-bot-silence --state open --json number --jq '.[0].number // empty')
          if [ "$STALE" = "true" ]; then
            if [ -n "$issue_number" ]; then
              echo "既にIssue #$issue_number が開いています。重複通知はしません"
            else
              gh issue create --repo "${{ github.repository }}" \
                --label cloud-bot-silence \
                --title "🔇 Cloud Botが長時間投稿していません" \
                --body "$(printf 'デッドマン・スイッチが、直近スロットの解禁から長時間投稿が無いことを検知しました。\n\nよくある原因:\n- GitHub Actions側の障害でcloud-bot.ymlそのものが起動できていない（ホストランナー確保失敗など）\n- 本体workflowが無効化されている（Disable workflow）\n- Secretsの期限切れ等でスクリプトが毎回失敗している（この場合は別途🚨失敗Issueも作られているはず）\n\ncloud-bot.ymlの実行履歴: https://github.com/%s/actions/workflows/cloud-bot.yml\n\n投稿が再開すると、このIssueは次回のチェックで自動的にクローズされます。' "${{ github.repository }}")"
              echo "無言停止Issueを作成しました"
            fi
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "${{ github.repository }}" \
              --reason completed \
              --comment "投稿が再開したことを確認しました。自動的にクローズします。"
            echo "投稿再開を確認したためIssue #$issue_number をクローズしました"
          fi
