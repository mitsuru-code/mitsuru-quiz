# クラウドBot: 時間帯別の時事コンテンツ自動生成・X自動投稿
# 番組表（JST）: 5時47分=朝ブリーフィング(20問Q&A) / 12時13分=昼のPollクイズ /
#              17時47分=夕方のPollクイズ / 20時47分=夜の振り返り(20問Q&A) /
#              6時47分・7時47分・8時47分・10時47分・15時47分=豆知識記事(ストック投稿・AI生成なし)
# - 15分おきに起動し、解禁済みスロットが未投稿なら生成して投稿（キャッチアップ方式）。
#   各スロットは「その時台の45分」に解禁されるので投稿は :47 前後に揃う（12時台のみ13分に解禁）
# - 速報チェックは深夜2:00/4:00・朝9:30〜11:00・午後14〜16時の固定時刻cronで実施（post-quiz.mjsのBREAKING_CHECKPOINTS参照）
# - 毎回の実行で、返信期限が来た正解もスレッド返信
# - 手動実行（Run workflow）でdry-run／強制投稿／接続テストが可能
name: Cloud Bot

on:
  schedule:
    # 15分おき（UTC）。JST判定はスクリプト側で行う。
    # GitHub Actionsのスケジュール実行は混雑時に予告なく間引かれる。実測（2026-08-05）では
    # 毎時47分の1本だけでは1日24回のうち約半数しか起動せず、9スロット中6本しか投稿できていなかった。
    # スロットは post-quiz.mjs の DEFAULT_RELEASE_MIN=45 により「:45以降」に解禁されるので、
    # このトリガー配置だと1スロットにつき :47 → 次時台の :02/:17/:32 と4回の機会がある。
    # 4回すべて間引かれる確率は低く、かつ番組表どおりの :47 前後に投稿される。
    # 毎時0分ちょうどはGitHub全体で最も混雑し間引かれやすいため、2分ずらしてある。
    # 投稿対象が無い回はAPIを一切呼ばず1秒未満で終了する（公開リポジトリのためAWS課金も無い）
    - cron: '2,17,32,47 * * * *'
    # 昼のスロットだけ12時13分(JST)＝3時13分(UTC)に投稿するための追加トリガー
    # （SLOT_PROFILESの 12: { releaseMin: 13 } と対応。他スロットより早い唯一の例外）
    - cron: '13 3 * * *'
    # 速報チェックポイント（post-quiz.mjsのBREAKING_CHECKPOINTS）は深夜2:00/4:00・朝9:30〜11:00・
    # 午後14〜16時（JST）だが、いずれも :00 か :30 なので上の15分おきトリガーに含まれる。
    # かつては専用cronを9本並べていたが、重複するだけなので削除した
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run（生成のみ・投稿しない）'
        type: boolean
        default: true
      force_post:
        description: '投稿スロット外でも投稿する（テスト用）'
        type: boolean
        default: true
      test_post:
        description: 'X接続テストのみ（クイズ生成せずテスト投稿を1回）'
        type: boolean
        default: false
      delete_tweet_id:
        description: '誤投稿の削除用（削除したい投稿のtweet IDを入力。空なら何もしない）'
        type: string
        default: ''
      get_tweet_id:
        description: '投稿本文の確認用（確認したい投稿のtweet IDを入力。空なら何もしない。ログに全文を表示）'
        type: string
        default: ''
      topic_hint:
        description: '今回だけ生成トピックを指定（例: ワールドカップ）。空なら通常通り幅広く生成'
        type: string
        default: ''
      feature_topic:
        description: '特集記事モード（番組表と無関係に指定した話題の記事を1本投稿。例: アルゼンチン対イングランドの試合内容）。空なら通常通り'
        type: string
        default: ''
      breaking_topic:
        description: '手動速報モード（指定した話題の🚨速報を1本投稿。1日2回の速報上限にカウントされる）。空なら通常通り'
        type: string
        default: ''
      force_slot:
        description: '取りこぼしたスロットを投稿し直す（時台の数字。例: 5=朝ブリーフィング）。force_postも一緒にONにする。空なら通常通り'
        type: string
        default: ''
      search_mode:
        description: '情報収集の方法。self=自前検索（安価・既定）／tool=Anthropicのweb_searchツール（従来）。dry_runと組み合わせて読み比べに使う'
        type: choice
        options: ['self', 'tool']
        default: 'self'
      reply_to_id:
        description: '訂正・補足の返信先ツイートID（reply_textと併用）。誤記の訂正などに使う。空なら何もしない'
        type: string
        default: ''
      reply_text:
        description: '返信の本文（reply_to_idと併用）。AI生成せずこの文面をそのまま投稿する'
        type: string
        default: ''

permissions:
  contents: write
  issues: write   # 実行失敗時のIssue自動作成用

concurrency:
  group: cloud-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: コンテンツ生成・投稿
        id: post
        run: node cloud-bot/post-quiz.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 自前検索（コスト削減）用。未設定ならAnthropicのweb_searchツールに自動フォールバックする
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # 'self'=自前検索（既定・安価） / 'tool'=従来のweb_searchツール。手動実行で切り替えて読み比べできる
          SEARCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.search_mode || 'self' }}
          # Secretsは X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_TOKEN_SECRET という名前で登録済み。
          # スクリプト内部の変数名（TWITTER_*）に合わせてここでマッピングする
          TWITTER_CONSUMER_KEY: ${{ secrets.X_API_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.X_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_post && 'true' || 'false' }}
          TEST_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.test_post && 'true' || 'false' }}
          DELETE_TWEET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_tweet_id || '' }}
          TOPIC_HINT: ${{ github.event_name == 'workflow_dispatch' && inputs.topic_hint || '' }}
          FEATURE_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.feature_topic || '' }}
          BREAKING_TOPIC: ${{ github.event_name == 'workflow_dispatch' && inputs.breaking_topic || '' }}
          GET_TWEET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.get_tweet_id || '' }}
          FORCE_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_slot || '' }}
          REPLY_TO_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.reply_to_id || '' }}
          REPLY_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.reply_text || '' }}
          # ANSWER_DELAY_HOURS: '2'        # 正解返信・Poll投票期間の長さ
          # MONTHLY_POST_LIMIT: '450'      # 月間投稿数の安全上限（X無料枠対策）
          BREAKING_ENABLED: 'false'        # 速報チェックを中止（自動検知・続報・朝の代替クイズもすべて停止）

      - name: 状態（返信キュー・出題履歴）をコミット
        run: |
          if git diff --quiet cloud-bot/state.json; then
            echo "state.json に変更なし"
            exit 0
          fi
          git config user.name "cloud-bot"
          git config user.email "actions@github.com"
          git add cloud-bot/state.json
          git commit -m "cloud-bot: 状態を更新 [skip ci]"
          # pushはGitHub側の一時障害や他ワークフローとの競合で失敗することがある。
          # ここで失敗すると「Xには投稿済みなのに、投稿した記録がmainに残らない」状態になり、
          # 次の実行が同じスロットを未投稿と誤認して重複投稿してしまう
          # （2026-07-28に remote: Internal Server Error で朝ブリーフィングが2回投稿された）。
          # 一時障害と競合の両方を吸収するため、rebaseを挟みながら最大5回リトライする
          for i in 1 2 3 4 5; do
            if git push; then
              echo "💾 state.json をmainへ反映しました（push試行 ${i} 回目）"
              exit 0
            fi
            echo "⚠️ pushに失敗しました（試行 ${i}/5）。最新のmainを取り込んで再試行します"
            sleep $((i * 10))
            git pull --rebase origin main || git rebase --abort || true
          done
          echo "❌ state.json のpushに5回失敗しました。Xには既に投稿済みの可能性が高く、この記録が失われると次回の実行で重複投稿が起きるおそれがあります"
          exit 1

      - name: 速報投稿をIssueで通知
        if: steps.post.outputs.breaking_posted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create breaking-news --repo "${{ github.repository }}" --color 1D76DB --description "速報投稿の通知（手動で続報を作る目安）" 2>/dev/null || true
          tweet_url="https://x.com/i/web/status/${{ steps.post.outputs.breaking_tweet_id }}"
          gh issue create --repo "${{ github.repository }}" \
            --label breaking-news \
            --title "🚨 速報を投稿しました: ${{ steps.post.outputs.breaking_headline }}" \
            --body "$(printf '速報を投稿しました。\n\n投稿: %s\n\n30分後に自動で1回だけ続報を投稿します。それ以上の続報が必要な場合は、Actionsの手動実行(workflow_dispatch)でBREAKING_TOPICまたはFEATURE_TOPICを指定して作成してください。' "$tweet_url")"

      # 失敗したらIssueを自動作成して通知（毎時の連続失敗でも未クローズのIssueがあれば重複作成しない）
      # 在庫切れは「切れてからログに出る」だけでは気づけない（ログは誰も見ない）。
      # 残りわずかの段階でIssueを立てて通知し、補充されたら自動でクローズする
      - name: 豆知識ストックの残量をIssueで通知
        if: always() && steps.post.outputs.trivia_remaining != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ steps.post.outputs.trivia_remaining }}
          LOW: ${{ steps.post.outputs.trivia_low }}
        run: |
          gh label create trivia-stock-low --repo "${{ github.repository }}" --color FBCA04 --description "豆知識ストックの残量が少ない" 2>/dev/null || true
          issue_number=$(gh issue list --repo "${{ github.repository }}" --label trivia-stock-low --state open --json number --jq '.[0].number // empty')
          if [ "$LOW" = "true" ]; then
            if [ -n "$issue_number" ]; then
              echo "既にIssue #$issue_number が開いています（残り ${REMAINING}本）。重複通知はしません"
              exit 0
            fi
            gh issue create --repo "${{ github.repository }}" \
              --label trivia-stock-low \
              --title "📚 豆知識ストックの残りが少なくなっています（残り ${REMAINING}本）" \
              --body "$(printf 'cloud-bot/trivia-stock.json の未投稿分が残り %s本です。\n\n豆知識は1日5本（6時・7時・8時・10時・15時台）消費するため、このままだとおよそ1日で尽きます。尽きると豆知識スロットは無言でスキップされ、1日の投稿数がそのぶん減ります。\n\nPC側の補充タスクを実行して、trivia-stock.json の末尾に追記してください。補充されると、このIssueは次の実行で自動的にクローズされます。\n\n※ 並べ替えや過去分の削除をすると投稿順がずれます。必ず末尾に追記してください。' "$REMAINING")"
            echo "在庫僅少Issueを作成しました（残り ${REMAINING}本）"
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "${{ github.repository }}" \
              --reason completed \
              --comment "補充を確認しました（残り ${REMAINING}本）。自動的にクローズします。"
            echo "補充されたためIssue #$issue_number をクローズしました"
          fi

      - name: 失敗をIssueで通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cloud-bot-failure --repo "${{ github.repository }}" --color D93F0B --description "Cloud Botの実行失敗" 2>/dev/null || true
          open_count=$(gh issue list --repo "${{ github.repository }}" --label cloud-bot-failure --state open --json number --jq 'length')
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$open_count" -gt 0 ]; then
            issue_number=$(gh issue list --repo "${{ github.repository }}" --label cloud-bot-failure --state open --json number --jq '.[0].number')
            gh issue comment "$issue_number" --repo "${{ github.repository }}" --body "再び失敗しました: $run_url"
            echo "既存の失敗Issue #$issue_number にコメントを追加しました"
          else
            gh issue create --repo "${{ github.repository }}" \
              --label cloud-bot-failure \
              --title "🚨 Cloud Bot の実行が失敗しています" \
              --body "$(printf 'Cloud Bot（クイズ自動投稿）の実行が失敗しました。\n\n失敗した実行のログ: %s\n\nログの ❌ で始まる行に原因が表示されています。よくある原因はAPIキーの期限切れ・残高不足・X APIの権限変更です。解決したらこのIssueをクローズしてください（クローズするまで新しいIssueは作られず、再失敗はこのIssueへのコメントで通知されます）。' "$run_url")"
            echo "失敗Issueを作成しました"
          fi
